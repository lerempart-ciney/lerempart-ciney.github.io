<script>
(function(){
const C = RP.config, Q = new URLSearchParams(location.search);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const parseDay = s => { if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
/* Les QR collés dans le gîte (vidéos, casse, boutique) n'ont pas de jeton de séjour.
   Si ce téléphone a déjà ouvert un lien de séjour encore valable, on rouvre ce lien avec la bonne page. */
const DERNIER = 'rp-sejour', JETON = /^[A-Za-z0-9_-]{16,64}$/;
if (JETON.test(Q.get('s') || '')) {
  const k = new URLSearchParams(location.search); k.delete('v'); k.delete('p'); store.set(DERNIER, k.toString());
} else if (Q.get('v') || Q.get('p')) {
  const k = new URLSearchParams(store.get(DERNIER) || ''), fin = parseDay(k.get('d'));
  if (fin) fin.setDate(fin.getDate() + 2);
  if (JETON.test(k.get('s') || '') && fin && new Date() < fin) {
    ['v','p'].forEach(x => { if (Q.get(x)) k.set(x, Q.get(x)); });
    location.replace('index.html?' + k.toString());
    return;
  }
}
const arrivee = parseDay(Q.get('a')), depart = parseDay(Q.get('d'));
/* Numéro du gîte dans Le Rempart (1, 2 ou 3), donné par le lien du séjour. */
const G = ['1','2','3'].includes(Q.get('g')) ? Q.get('g') : null;
const lieuNom = 'Le Rempart · ' + (G ? 'Gîte ' + G : 'Ciney');
const sejourId = (G ? 'g' + G + '_' : '') + (arrivee && depart ? Q.get('a') + '_' + Q.get('d') : 'general');
const listKey = 'rp-liste-' + sejourId;
/* Jeton du séjour (créé par l'hôte) : active la liste partagée et l'album. */
const S = /^[A-Za-z0-9_-]{16,64}$/.test(Q.get('s') || '') ? Q.get('s') : null;
let partagee = null, horsLigne = false, album = null, envoi = 0, albumErr = '', suppr = null, souv = null, souvEnCours = false, souvErr = '';

/* Avec un lien de séjour, le voyageur choisit sa langue à la première ouverture ; ce choix est enregistré pour Sam. */
const langKey = S ? 'rp-lang-' + S : 'rp-lang';
let lang = RP.langues[Q.get('l')] ? Q.get('l') : (RP.langues[store.get(langKey)] ? store.get(langKey) : null);
/* État du séjour donné par le serveur : langue, arrivée annoncée, et (après l'annonce) Wi-Fi et codes. */
let etat = null, arrErr = '';
/* Pages ouvertes depuis l'accueil ou un QR : boutique déco du gîte, signalement de casse. */
let page = ['boutique','casse'].includes(Q.get('p')) ? Q.get('p') : null, shop = null, shopErr = '';
const casseVide = () => ({objet:null, v:{moment:'sejour', quantite:'1'}, photo:null, envoi:false, fait:false, err:'', wa:''});
let casse = casseVide();
let tab = 0, cat = 'tout', video = RP.videos[Q.get('v')] && RP.dansGite(Q.get('v'), G) ? Q.get('v') : null;
if (video) { tab = 3; }
/* Cases cochées de la liste « avant de partir » (sur ce téléphone). */
const depKey = 'rp-depart-' + sejourId;
let depFait = (() => { try { return JSON.parse(store.get(depKey)) || {}; } catch (e) { return {}; } })();
let meteo = null;
const L = k => RP.t[k][lang];
const E = RP.esc;
const now = () => new Date();

/* Fin de séjour : le lien s'arrête le lendemain du départ, et la liste est effacée. */
function termine(){
  if (!depart) return false;
  const fin = new Date(depart); fin.setDate(fin.getDate()+1); fin.setHours(23,59,59);
  return now() > fin;
}

const ICONS = {
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 cloud:'<path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.6 4.2 4.2 0 0 0 7 18z"/>',
 rain:'<path d="M7 15h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 6.6 4.2 4.2 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
 pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 play:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
 cart:'<path d="M3 4h2l2.4 11h10.4L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/>',
 photo:'<rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 5l1.5-2h4l1.5 2"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>',
 compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 bell:'<path d="M5 17h14M7 17v-5a5 5 0 0 1 10 0v5M12 4v2M4 20h16"/>',
 tri:'<path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/>',
 pin:'<path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 son:'<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const ico = (k, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICONS[k]}</svg>`;
const fmt = (d,o) => new Intl.DateTimeFormat(RP.langues[lang], o).format(d);
const wa = text => 'https://wa.me/' + RP.waNumber() + (text ? '?text=' + encodeURIComponent(text) : '');
const top = over => `<div class="top${over ? ' over' : ''}"><div class="brand"><span class="mono" aria-hidden="true">R</span><span class="wordmark"><b>Le Rempart</b><small>${E(G ? 'Gîte ' + G : 'Ciney')}</small></span></div><button class="langbtn" data-act="lang" aria-label="${E(L('choose'))}">${lang.toUpperCase()}</button></div>`;

/* ---------- Écrans ---------- */
function vLangue(){
  return `<div class="center">
    <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start"><span class="mono" aria-hidden="true" style="color:var(--champ-ink);width:52px;height:52px;font-size:1.6rem">R</span><div class="eyebrow">Le Rempart · Ciney</div><h1 class="title">Bienvenue<br><i style="font-weight:300">Welcome · Welkom · Willkommen · Bienvenidos</i></h1><hr class="rule"></div>
    <div class="langs">${Object.keys(RP.langues).map(k=>`<button data-lang="${k}" lang="${k}"><span>${RP.nomsLangues[k]}</span><small>${k.toUpperCase()}</small></button>`).join('')}</div>
  </div>`;
}

function vFin(){
  return `<div class="center">
    <div class="eyebrow">Le Rempart · Ciney</div>
    <h1 class="title">${E(L('ended'))}</h1><hr class="rule">
    <p>${E(L('endedTxt'))}</p>
    <a class="btn" href="${wa('')}" target="_blank" rel="noopener">${E(L('writeWa'))}</a>
    <div class="row"><span>WhatsApp</span><span class="nw">${E(C.whatsapp)}</span></div>
    ${C.email?`<div class="row"><span>E-mail</span><a href="mailto:${E(C.email)}">${E(C.email)}</a></div>`:''}
  </div>`;
}

/* Wi-Fi et codes : seulement avec un lien de séjour, après l'annonce de l'arrivée. */
function acces(){
  if (!S) return `<p class="muted">${E(L('guideOnly'))}</p>`;
  if (!etat) return '';
  if (!etat.debloque) return `<div class="lock"><b class="lockt">${ico('lock')} ${E(L('lockTitle'))}</b><p class="muted" style="margin:0">${E(L(etat.retire?'retireTxt':'lockTxt'))}</p></div>`;
  const w = etat.wifi || {}, c = etat.codes || {}, qr = RP.wifiQr(w.reseau ? w : null);
  return `<div class="eyebrow" style="margin-top:6px">${E(L('accessTitle'))}</div>
    ${w.reseau?`<div class="row"><span>Wi-Fi · ${E(L('network'))}</span><span>${E(w.reseau)}</span></div>
      <div class="row"><span>Wi-Fi · ${E(L('pass'))}</span><span class="nw">${E(w.motDePasse||'')}</span></div>
      ${qr?`<div class="wifi-qr">${qr}</div>`:''}`:`<p class="muted">${E(L('wifiSoon'))}</p>`}
    ${c.portail?`<div class="row"><span>${E(L('gate'))}</span><span class="nw"><b>${E(c.portail)}</b></span></div>`:''}
    ${c.porte?`<div class="row"><span>${E(L('door'))}</span><span class="nw"><b>${E(c.porte)}</b></span></div>`:''}
    ${c.sauna?`<div class="row"><span>${E(L('saunaCode'))}</span><span class="nw"><b>${E(c.sauna)}</b></span></div>`:''}
    <p class="muted">${E(c.portail||c.porte||c.sauna?L('keepCodes'):L('noCodes'))}</p>`;
}
/* Le bouton d'arrivée (et donc le Wi-Fi et les codes) n'est disponible qu’à partir de 13 h le jour prévu de l'arrivée.
   Le serveur décide (heure belge) ; sans réponse du serveur, on utilise l'heure du téléphone. */
function tropTot(){
  if (!S || !arrivee) return false;
  if (etat) return !(etat.debloque || etat.peutAnnoncer);
  const debut = new Date(arrivee); debut.setHours(13, 0, 0, 0);
  return now() < debut;
}
async function chargerEtat(){
  if (!S) return;
  const avant = JSON.stringify(etat);
  try {
    etat = await RP.api('etat', S);
    if (!lang && RP.langues[etat.langue]) { lang = etat.langue; store.set(langKey, lang); }
    else if (lang && !etat.langue && !Q.get('l')) { etat.langue = lang; RP.api('langue', S, {langue: lang}).catch(() => {}); }
  } catch (e) { if (e.status === 403) etat = null; }
  if (JSON.stringify(etat) !== avant) render(true); /* redessine seulement si quelque chose a changé */
}
async function annoncerArrivee(heure){
  arrErr = '';
  try { await RP.api('arrivee', S, {heure}); }
  catch (e) { if (e.status === 409) arrErr = ''; else horsLigne = true; }
  chargerEtat();
}

/* ---------- Accueil : grande photo, mot de Sam, sommaire ---------- */
const nbNuits = () => arrivee && depart ? Math.round((depart - arrivee) / 864e5) : 0;
const datesCourtes = () => arrivee && depart ? fmt(arrivee,{day:'numeric',month:'long'}) + ' — ' + fmt(depart,{day:'numeric',month:'long'}) : '';
const ROMAIN = ['I','II','III','IV','V','VI','VII','VIII'];
function vAccueil(){
  const g1 = !G || G === '1';
  const g2 = G === '2', P = 'assets/img/gite/';
  const tuiles = [
    {t:1, img:P + (g1 ? 'g1-salle' : 'ext-table') + '.jpg', b:L('rSejour'), s:L('rSejourS')},
    {t:2, img:P + 'ext-cour.jpg', b:L('rExp'), s:L('rExpS')},
    {t:3, ...(g1 ? {img:P + 'g1-piscine.jpg'} : g2 ? {img:P + 'g2-salon.jpg'} : {des:'feu'}), b:L('rBien'), s:L(g1 ? 'rBienS1' : 'rBienS'), ancre:'bien'},
    {t:3, ...(g1 ? {img:P + 'g1-cuisine.jpg'} : g2 ? {img:P + 'g2-cuisine.jpg'} : {des:'cuisine23'}), b:L('rGuide'), s:L('rGuideS'), ancre:'equip'}
  ];
  const gal = (g1 ? [1,2,3,4,5,6].map(i => 'g1-' + i) : g2 ? [1,2,3].map(i => 'g2-' + i) : []).concat([1,2,3].map(i => 'ext-' + i));
  const lignes = [
    {t:4, b:L('rServ'), s:L('rServS')},
    {t:1, b:L('rDep'), s:L('rDepS'), ancre:'depart'}
  ].concat(S ? [{act:'shop', b:L('shopTitle'), s:L('rShopS')}] : []);
  const annonce = S && etat && !etat.debloque && !tropTot();
  return `${top(true)}
    <header class="hero">
      <img src="assets/img/hero-m.jpg" srcset="assets/img/hero-m.jpg 900w, assets/img/hero-l.jpg 1600w" sizes="100vw" alt="${E(L('alt'))}" fetchpriority="high">
      <div class="hero-in">
        <div class="eyebrow">${E(L('kicker'))}${G ? ' · Gîte ' + G : ''}</div>
        <h1 class="title">${E(L('heroTitle'))}</h1>
        <hr class="rule">
        ${datesCourtes() ? `<div class="dates">${E(datesCourtes())}</div>` : ''}
        <p>${E(L('heroLine'))}</p>
        <button class="btn ghost" data-tab="1">${E(L('heroBtn'))}</button>
      </div>
    </header>
    ${annonce ? `<div class="sec" style="padding:22px 0;border-top:0"><button class="link" data-tab="1" data-ancre="arrivee">${E(L('arrLink'))}</button></div>` : ''}
    <section class="sec">
      <div class="eyebrow">${E(L('wordFrom'))}</div>
      <div class="note">
        <div class="vbox"><video id="vAcc" src="${E(RP.videoAccueil[lang] || RP.videoAccueil.fr)}" poster="assets/accueil.jpg?v=20261128a" playsinline preload="auto" aria-label="Sam"></video><button class="son" data-act="son" type="button" aria-label="${E(L('sound'))}" hidden>${ico('son')}</button></div>
        <div><blockquote>${E(L('intro'))}</blockquote><div class="sign">— ${E(L('host'))}</div></div>
      </div>
      ${inviter()}
    </section>
    <section class="sec gal-sec">
      <div class="sec-h"><h2>${E(L('gal'))}</h2></div>
      <div class="gal" tabindex="0" aria-label="${E(L('gal'))}">${gal.map(k => `<figure><img src="assets/img/gite/gal-${k}.jpg" alt="" loading="lazy" decoding="async"></figure>`).join('')}</div>
    </section>
    <section class="sec">
      <div class="sec-h"><h2>${E(L('index'))}</h2></div>
      <div class="tiles">${tuiles.map((x, i) => `<button class="tile" data-tab="${x.t}" ${x.ancre ? `data-ancre="${x.ancre}"` : ''}>
        <span class="ph${x.des ? ' ill' : ''}">${x.des ? RP.dessin(x.des) : `<img src="${x.img}" alt="" loading="lazy">`}</span>
        <span class="num">${ROMAIN[i]}.</span><b>${E(x.b)}</b><span class="s">${E(x.s)}</span></button>`).join('')}</div>
      <div class="idx">${lignes.map((x, i) => `<button ${x.act ? `data-act="${x.act}"` : `data-tab="${x.t}"`} ${x.ancre ? `data-ancre="${x.ancre}"` : ''}>
        <span class="num">${ROMAIN[i + tuiles.length]}.</span><span><b>${E(x.b)}</b><small>${E(x.s)}</small></span><span class="arrow">→</span></button>`).join('')}</div>
    </section>
    ${pied()}`;
}
const pied = () => `<footer class="foot"><span class="mono" aria-hidden="true">R</span><span>Le Rempart · ${E(C.adresse)}</span>${C.email?`<a href="mailto:${E(C.email)}">${E(C.email)}</a>`:''}</footer>`;

/* ---------- Séjour : dates, accès, arrivée, liste et album, départ ---------- */
function vSejour(){
  const n = nbNuits(), dep = RP.departListe(lang, G);
  return `${top()}
    <header class="pagehead"><div class="eyebrow">${E(L('kicker'))}</div><h1 class="title">${E(L('rSejour'))}</h1><hr class="rule"></header>
    ${arrivee && depart ? `<section class="sec" style="border-top:0;padding-top:0">
      <div class="stay-dates">
        <div><small>${E(L('arrive'))}</small><b>${E(fmt(arrivee,{day:'numeric'}))}</b><small>${E(fmt(arrivee,{weekday:'long'}))} · ${E(fmt(arrivee,{month:'long'}))}</small></div>
        <div class="mid">${n} ${E(L('nights')[n > 1 ? 1 : 0])}</div>
        <div><small>${E(L('leave'))}</small><b>${E(fmt(depart,{day:'numeric'}))}</b><small>${E(fmt(depart,{weekday:'long'}))} · ${E(fmt(depart,{month:'long'}))}</small></div>
      </div></section>` : ''}
    <section class="sec">
      <div class="sec-h"><span class="num">I.</span><h2>${E(L('findUs'))}</h2></div>
      <div class="row"><span>${E(L('address'))}</span><span>${E(C.adresse)}</span></div>
      <div class="row"><span>GPS</span><span class="nw">${E(C.gps)}</span></div>
      <a class="btn ghost route" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(C.gps.replace(/\s/g,''))}" target="_blank" rel="noopener">${ico('pin')}${E(L('route'))}</a>
    </section>
    <section class="sec" id="arrivee">
      <div class="sec-h"><span class="num">II.</span><h2>${E(L('arrive'))}</h2></div>
      ${etat&&etat.debloque?`<span class="tag t-ok" style="align-self:flex-start">${E(L('arrDone'))}</span>`:''}
      <p class="muted">${E(L('arrHint'))}</p>
      <button class="btn${tropTot()?' wait':''}" data-act="arr" aria-expanded="false" aria-controls="arrBox" ${tropTot()?'disabled':''}>${tropTot()?ico('lock'):''}${E(L('arrBtn'))}</button>
      ${tropTot()?`<p class="muted"><b>${E(L('lockFrom').replace('{d}', fmt(arrivee,{weekday:'long',day:'numeric',month:'long'})))}</b></p>
        <button class="btn ghost" data-act="ics">${E(L('remind'))}</button><p class="muted">${E(L('remindNote'))}</p>`:''}
      ${arrErr?`<p class="miss">${E(arrErr)}</p>`:''}
      <div id="arrBox" hidden style="display:flex;flex-direction:column;gap:12px">
        <div class="field"><label for="arrT">${E(L('arrTime'))}</label><input type="time" id="arrT" value="16:00"></div>
        <div class="bubble" id="arrMsg"></div>
        <a class="btn" id="arrGo" href="#" target="_blank" rel="noopener">${E(L('arrSend'))}</a>
        <p class="muted">${E(L('arrNote'))}</p>
        ${arrivee?`<button class="btn ghost" data-act="ics">${E(L('remind'))}</button><p class="muted">${E(L('remindNote'))}</p>`:''}
      </div>
      ${acces()}
    </section>
    <section class="sec">
      <div class="sec-h"><span class="num">III.</span><h2>${E(L('extras'))}</h2></div>
      <div class="idx">
        <button data-page="liste"><span class="num">—</span><span><b>${E(L('rList'))}</b><small>${E(L(S ? 'listShared' : 'listTxt'))}</small></span><span class="arrow">→</span></button>
        ${S ? `<button data-page="album"><span class="num">—</span><span><b>${E(L('album'))}</b><small>${E(L('albumTxt'))}</small></span><span class="arrow">→</span></button>` : ''}
      </div>
      ${inviter()}
    </section>
    <section class="sec" id="depart">
      <div class="sec-h"><span class="num">IV.</span><h2>${E(L('rDep'))}</h2></div>
      <p class="lead">${E(L('depThanks'))}</p>
      ${dep.important ? `<p class="notice">${E(dep.important)}</p>` : ''}
      ${dep.items.length ? `<div class="eyebrow" style="margin-top:8px">${E(L('depCheck'))}</div>
        <div class="check">${dep.items.map((t, i) => `<label><input type="checkbox" data-dep="${i}" ${depFait[i] ? 'checked' : ''}><span>${E(t.charAt(0).toUpperCase() + t.slice(1))}</span></label>`).join('')}</div>
        <p class="muted">${E(L('depHint'))}</p>` : ''}
      <a class="btn ghost" href="${wa((G?'[Gîte '+G+'] ':'') + L('depMsg'))}" target="_blank" rel="noopener">${E(L('depFeedback'))}</a>
    </section>
    ${pied()}`;
}

function meteoCard(){
  if (!meteo) return '';

function chargerImg(url){
  return new Promise((ok, ko) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = ko; i.src = url; });
}
function couvrir(x, img, dx, dy, w, h){
  const k = Math.max(w / img.naturalWidth, h / img.naturalHeight), sw = w / k, sh = h / k;
  x.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, dx, dy, w, h);
}
function arrondi(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function lignes(x, txt, maxW, maxL){
  const mots = txt.split(/\s+/), out = []; let l = '';
  for (const m of mots) { const t = l ? l + ' ' + m : m; if (x.measureText(t).width > maxW && l) { out.push(l); l = m; } else l = t; }
  if (l) out.push(l);
  if (out.length > maxL) { out.length = maxL; out[maxL-1] = out[maxL-1].replace(/\s*\S*$/, '') + '…'; }
  return out;
}

function espace(x, txt, X, Y, px){ x.save(); if ('letterSpacing' in x) { x.letterSpacing = px + 'px'; x.fillText(txt, X, Y); } else x.fillText(txt.split('').join(String.fromCharCode(8202)), X, Y); x.restore(); }
/* Cases d'une page (1 à 4 photos), avec 2 variantes pour alterner d'une page à l'autre. */
function grille(n, X, Y, W, H, g, v){
  const c = (x, y, w, h) => [X + x, Y + y, w, h], h2 = (H - g) / 2, w2 = (W - g) / 2;
  if (n === 1) return [c(0, 0, W, H)];
  if (n === 2) return v ? [c(0, 0, W, H * .58), c(0, H * .58 + g, W, H * .42 - g)] : [c(0, 0, w2, H), c(w2 + g, 0, w2, H)];
  if (n === 3) { const hb = H * .56; return v ? [c(0, 0, w2, H - hb - g), c(w2 + g, 0, w2, H - hb - g), c(0, H - hb, W, hb)]
                                                 : [c(0, 0, W, hb), c(0, hb + g, w2, H - hb - g), c(w2 + g, hb + g, w2, H - hb - g)]; }
  const hh = H * .6; return v ? [c(0, 0, w2, h2), c(w2 + g, 0, w2, h2), c(0, h2 + g, w2, h2), c(w2 + g, h2 + g, w2, h2)]
    : [c(0, 0, W * .62, hh), c(W * .62 + g, 0, W * .38 - g, hh), c(0, hh + g, W * .38, H - hh - g), c(W * .38 + g, hh + g, W * .62 - g, H - hh - g)];
}
/* Répartit n photos en pages de 1 à 4, sans page trop vide. */
function decouper(n){ const k = Math.ceil(n / 4), out = []; for (let i = 0; i < k; i++) out.push(Math.floor(n / k) + (i < n % k ? 1 : 0)); return out; }
function nouvellePage(){ const c = document.createElement('canvas'); c.width = PW; c.height = PH; return c; }
const enBlob = c => new Promise((ok, ko) => c.toBlob(b => b ? ok(b) : ko(new Error('toBlob')), 'image/jpeg', 0.9));
/* PDF minimal : une image JPEG par page (format 4:5). */
async function pdfDepuis(blobs){
  const enc = new TextEncoder(), parts = [], offs = []; let pos = 0;
  const add = d => { const u = typeof d === 'string' ? enc.encode(d) : d; parts.push(u); pos += u.length; };
  const obj = (id, d) => { offs[id] = pos; add(id + ' 0 obj\n'); (Array.isArray(d) ? d : [d]).forEach(add); add('\nendobj\n'); };
  const n = blobs.length, w = 540, h = 675;
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Count ' + n + ' /Kids [' + blobs.map((_, i) => (3 + i*3) + ' 0 R').join(' ') + '] >>');
  for (let i = 0; i < n; i++) {
    const id = 3 + i*3, img = new Uint8Array(await blobs[i].arrayBuffer()), cs = 'q ' + w + ' 0 0 ' + h + ' 0 0 cm /Im0 Do Q';
    obj(id, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + w + ' ' + h + '] /Resources << /XObject << /Im0 ' + (id+2) + ' 0 R >> >> /Contents ' + (id+1) + ' 0 R >>');
    obj(id+1, ['<< /Length ' + cs.length + ' >>\nstream\n', cs, '\nendstream']);
    obj(id+2, ['<< /Type /XObject /Subtype /Image /Width ' + PW + ' /Height ' + PH + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.length + ' >>\nstream\n', img, '\nendstream']);
  }
  const nb = 3 + n*3, xref = pos;
  add('xref\n0 ' + nb + '\n0000000000 65535 f \n' + offs.slice(1, nb).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  add('trailer\n<< /Size ' + nb + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(parts, {type: 'application/pdf'});
}
async function creerSouvenir(){
  souvEnCours = true; souvErr = ''; render(true);

    await Promise.all([document.fonts.load('120px "Young Serif"'), document.fonts.load('600 30px Figtree'), document.fonts.load('italic 400 30px "Young Serif"')]).catch(()=>{});
    const photos = album.photos.filter(p => p.url).slice(0, MAXP);

    const dates = arrivee && depart ? fmt(arrivee,{day:'numeric',month:'long'}) + ' – ' + fmt(depart,{day:'numeric',month:'long',year:'numeric'}) : '';
    // Page 1 : couverture.
    let c = nouvellePage(), x = c.getContext('2d');
    couvrir(x, cour, 0, 0, PW, PH);
    let g = x.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, 'rgba(247,245,240,.55)'); g.addColorStop(1, 'rgba(247,245,240,0)');
    x.fillStyle = g; x.fillRect(0, 0, PW, 700);
    x.textAlign = 'center'; x.fillStyle = GOLD; x.font = '700 22px Figtree, sans-serif'; espace(x, 'CINEY · BELGIQUE' + (G ? ' · GÎTE ' + G : ''), PW/2, 150, 6);
    x.fillStyle = INK; x.font = '150px "Young Serif", Georgia, serif'; x.fillText('Le Rempart', PW/2, 300);
    x.fillStyle = '#3d4741'; x.font = '400 32px Figtree, sans-serif'; x.fillText(L('ourStay') + (dates ? '  ·  ' + dates : ''), PW/2, 362);
    /* Sous-titre de la couverture : le titre choisi par le groupe (rien s'il est vide). */
    const titre = (album.titre || '').trim();
    if (titre) { x.font = 'italic 400 38px "Young Serif", Georgia, serif'; x.fillStyle = INK;
      lignes(x, titre, PW - 2*M - 80, 2).forEach((t, k) => x.fillText(t, PW/2, 440 + k * 50)); }
    g = x.createLinearGradient(0, PH - 220, 0, PH); g.addColorStop(0, 'rgba(10,14,12,0)'); g.addColorStop(1, 'rgba(10,14,12,.55)');
    x.fillStyle = g; x.fillRect(0, PH - 220, PW, 220);
    x.fillStyle = '#fff'; x.font = '600 20px Figtree, sans-serif'; espace(x, L('souvenirFoot').toUpperCase() + '  ·  ' + photos.length + (photos.length === 1 ? ' PHOTO' : ' PHOTOS'), PW/2, PH - 56, 5);
    pages.push(c);
    // Pages suivantes : uniquement les photos des voyageurs.
    const tailles = decouper(imgs.length), total = tailles.length + 1; let i0 = 0;
    tailles.forEach((n, pi) => {
      c = nouvellePage(); x = c.getContext('2d');
      x.fillStyle = '#f7f5f0'; x.fillRect(0, 0, PW, PH);
      x.textAlign = 'left'; x.fillStyle = INK; x.font = '700 18px Figtree, sans-serif'; espace(x, 'LE REMPART', M, 82, 5);
      x.textAlign = 'right'; x.fillStyle = MUTE; x.font = '400 18px Figtree, sans-serif'; x.fillText((pi + 2) + ' / ' + total, PW - M, 82);
      x.fillStyle = '#d9d4c8'; x.fillRect(M, 104, PW - 2*M, 1);
      const cases = grille(n, M, 136, PW - 2*M, PH - 136 - 120, 14, pi % 2);
      for (let k = 0; k < n; k++) {
        const [X, Y, w, h] = cases[k], im = imgs[i0 + k], leg = photos[i0 + k].legende;
        x.save(); arrondi(x, X, Y, w, h, 3); x.clip(); couvrir(x, im, X, Y, w, h);
        if (leg) {
          x.font = 'italic 400 ' + (w > 500 ? 28 : 22) + 'px "Young Serif", Georgia, serif';
          const ls = lignes(x, leg, w - 44, 2), lh = w > 500 ? 36 : 29;
          g = x.createLinearGradient(0, Y + h - lh * ls.length - 80, 0, Y + h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.62)');
          x.fillStyle = g; x.fillRect(X, Y + h - lh * ls.length - 80, w, lh * ls.length + 80);
          x.fillStyle = '#fff'; x.textAlign = 'left'; ls.forEach((t, j) => x.fillText(t, X + 22, Y + h - 22 - (ls.length - 1 - j) * lh));
        }
        x.restore();
      }
      i0 += n;
      x.fillStyle = '#d9d4c8'; x.fillRect(M, PH - 92, PW - 2*M, 1);
      x.strokeStyle = GOLD; x.lineWidth = 1.5; x.beginPath(); x.arc(M + 18, PH - 50, 18, 0, Math.PI * 2); x.stroke();
      x.fillStyle = GOLD; x.textAlign = 'center'; x.font = '20px "Young Serif", Georgia, serif'; x.fillText('R', M + 18, PH - 43);
      x.textAlign = 'left'; x.fillStyle = MUTE; x.font = '400 18px Figtree, sans-serif'; x.fillText(L('souvenirSign'), M + 50, PH - 44);
      x.textAlign = 'right'; x.font = 'italic 400 18px Figtree, sans-serif'; x.fillText(dates, PW - M, PH - 44);
      pages.push(c);
    });
    const blobs = await Promise.all(pages.map(enBlob)), pdf = await pdfDepuis(blobs);
    oublierSouv();
    souv = { pages: blobs.map((b, i) => ({ url: URL.createObjectURL(b), file: new File([b], 'le-rempart-' + String(i + 1).padStart(2, '0') + '.jpg', {type:'image/jpeg'}) })),
             pdf: URL.createObjectURL(pdf) };
  } catch (e) { souvErr = L('souvenirErr'); }
  souvEnCours = false; render(true);
}

/* Réduit la photo (max 2560 px, JPEG) avant l'envoi. Si le navigateur ne sait pas la lire, envoie l'original. */
function reduire(f){
  return new Promise(ok => {
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 2560 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => ok(b && b.size < f.size ? new File([b], 'photo.jpg', {type:'image/jpeg'}) : f), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); ok(f); };
    img.src = u;
  });
}
async function envoyer(fichiers){
  albumErr = ''; envoi = fichiers.length; render(true);
  for (const f of fichiers) {
    try { const fd = new FormData(); fd.append('photo', await reduire(f)); album = await RP.api('album', S, fd); oublierSouv(); }
    catch (e) { albumErr = L('photoErr') + (e.message && !/fetch/i.test(e.message) ? ' (' + e.message + ')' : ''); }
    envoi--; render(true);
  }
}

/* Vidéo d'accueil : démarre seule, une fois, à l'ouverture. Si le téléphone refuse le son, elle démarre sans son
   et le bouton 🔊 apparaît. Toucher la vidéo : son, pause ou reprise. */
let accueilLance = false;
function majSon(){
  const vd = document.getElementById('vAcc'), b = document.querySelector('.son');
  if (b && vd) b.hidden = !vd.muted;
}
function lancerAccueil(){
  const vd = document.getElementById('vAcc');
  if (!vd) return;
  vd.onvolumechange = majSon;
  if (accueilLance) { majSon(); return; }
  accueilLance = true; vd.muted = false;
  const p = vd.play();
  if (p) p.catch(() => { vd.muted = true; majSon(); vd.play().catch(() => {}); });
  majSon();
}
function toucherAccueil(){
  const vd = document.getElementById('vAcc'); if (!vd) return;
  if (vd.muted) { vd.muted = false; if (vd.paused) vd.play().catch(() => {}); }
  else if (vd.paused || vd.ended) vd.play().catch(() => {});
  else vd.pause();
  majSon();
}

function majArrivee(){
  const t = document.getElementById('arrT'), m = document.getElementById('arrMsg'), go = document.getElementById('arrGo');
  if (!t) return;
  const msg = L('arrMsg').replace('{t}', t.value || '…');

  if (S && e.target.closest('#arrGo')) { annoncerArrivee((document.getElementById('arrT') || {}).value || ''); }
  if (e.target.closest('#vAcc')) { toucherAccueil(); return; }
  const b = e.target.closest('[data-lang],[data-tab],[data-page],[data-cat],[data-act],[data-video],[data-del],[data-brk]'); if (!b) return;
  if (b.dataset.brk){ casse = casseVide(); casse.objet = b.dataset.brk; page = 'casse'; render(); return; }
  if (b.dataset.act === 'shop'){ page = 'boutique'; render(); if (!shop) chargerBoutique(); return; }
  if (b.dataset.act === 'casse'){ casse = casseVide(); page = 'casse'; render(); if (!shop) chargerBoutique(); return; }
  if (b.dataset.act === 'casseAgain'){ casse = casseVide(); render(); return; }
  if (b.dataset.act === 'back'){ const p0 = page; page = null; if (p0 === 'liste' || p0 === 'album') ancre = null; render(); return; }
  if (b.dataset.page){ page = b.dataset.page; render(); if (page === 'liste') chargerListe(); if (page === 'album' && (!etat || etat.debloque)) chargerAlbum(); return; }
  if (b.dataset.act === 'closeVid'){ video = null; render(true); return; }
  if (b.dataset.del){
    const id = b.dataset.del; /* identifiant texte (UUID) */
    if (suppr !== id){ suppr = id; render(true); return; }
    suppr = null; oublierSouv(); RP.api('album_suppr', S, {id}).then(chargerAlbum, () => { horsLigne = true; render(true); }); return;
  }
  if (b.dataset.lang){
    lang = b.dataset.lang; store.set(langKey, lang); tab = video ? 3 : 0; render();
    /* Premier choix du groupe : enregistré pour Sam (page « Mes séjours »). */
    if (S && etat && !etat.langue) { etat.langue = lang; RP.api('langue', S, {langue: lang}).catch(() => {}); }
    return;
  }
  if (b.dataset.tab){ tab = +b.dataset.tab; page = null; ancre = b.dataset.ancre || null; render(); return; }
  if (b.dataset.cat){ cat = b.dataset.cat; render(true); return; }
  if (b.dataset.video){ video = b.dataset.video; ancre = 'lecteur'; render(); return; }
  if (b.dataset.act === 'son'){ toucherAccueil(); return; }
  if (b.dataset.act === 'lang'){ lang = null; render(); return; }
  if (b.dataset.act === 'arr'){ const box = document.getElementById('arrBox'); box.hidden = !box.hidden; b.setAttribute('aria-expanded', String(!box.hidden)); majArrivee(); return; }
  if (b.dataset.act === 'ics'){ ics(); return; }
  if (b.dataset.act === 'invite'){ partagerLien(); return; }
  if (b.dataset.act === 'souv'){ creerSouvenir(); return; }
  if (b.dataset.act === 'souvShare'){ navigator.share({files:souv.pages.map(p=>p.file), title:L('souvenirTitle')}).catch(()=>{}); return; }
  if (b.dataset.act === 'clear'){ if (enPartage()) opListe({op:'vider'}); else { saveListe(listeLocale().filter(i=>!i.d)); render(true); } return; }
});
/* Légendes de l'album : gardées tout de suite dans la page, puis enregistrées sur le serveur (1 s après la dernière lettre). */
const legAttente = {};
function enregistrerLegende(id, v){
  clearTimeout(legAttente[id]); delete legAttente[id];
  RP.api('album_legende', S, {id, legende: v}).catch(() => { horsLigne = true; render(true); });
}
document.addEventListener('input', e => {
  if (e.target.id === 'arrT') majArrivee();
  if (e.target.id === 'albTitre' && album){
    album.titre = e.target.value.slice(0, 80);
    clearTimeout(legAttente.titre); legAttente.titre = setTimeout(() => {
      delete legAttente.titre; RP.api('album_titre', S, {titre: album.titre.trim()}).catch(() => { horsLigne = true; render(true); });
    }, 1000);
  }
  if (e.target.dataset && e.target.dataset.cap){
    const id = e.target.dataset.cap, v = e.target.value.slice(0, 140), p = album && album.photos.find(q => q.id === id);
    if (p) p.legende = v;
    clearTimeout(legAttente[id]); legAttente[id] = setTimeout(() => enregistrerLegende(id, v.trim()), 1000);
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.dep !== undefined){ depFait[e.target.dataset.dep] = e.target.checked; store.set(depKey, JSON.stringify(depFait)); return; }
  if (e.target.id === 'albTitre'){ if (souv) { oublierSouv(); render(true); } return; }
  if (e.target.id === 'casPhoto'){ casse.photo = e.target.files[0] || null; const t = document.getElementById('casPhotoTxt'); if (t) t.textContent = L(casse.photo ? 'brkPhotoOk' : 'brkPhoto'); return; }
  if (e.target.id === 'photoIn' && e.target.files.length){ envoyer(Array.from(e.target.files)); return; }
  if (e.target.dataset && e.target.dataset.cap){
    const id = e.target.dataset.cap, v = e.target.value.trim().slice(0, 140), p = album && album.photos.find(q => q.id === id);
    if (p) p.legende = v;
    enregistrerLegende(id, v);
    if (souv) { oublierSouv(); render(true); }
    return;
  }
  if (e.target.dataset && e.target.dataset.i !== undefined){
    const l = liste(), it = l[+e.target.dataset.i];
    if (enPartage()) { it.d = e.target.checked; opListe({op:'coche', id:it.id, fait:it.d}); return; }
    it.d = e.target.checked; saveListe(l); render(true);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'casseForm') { e.preventDefault(); if (!casse.envoi) envoyerCasse(e.target); return; }
  if (e.target.id !== 'addForm') return; e.preventDefault();
  const i = document.getElementById('addInput'), v = i.value.trim(); if (!v) return;
  if (enPartage()) { i.value = ''; opListe({op:'ajout', nom:v.slice(0,80)}); return; }
  const l = listeLocale(); l.push({n:v.slice(0,80), d:false}); saveListe(l); render(true);
  const n = document.getElementById('addInput'); if (n) n.focus();
});

/* Barre du haut transparente sur la photo d'accueil, puis pleine dès qu'on descend. */
function majHaut(){ const h = document.querySelector('.hero'); document.body.classList.toggle('scrolled', !h || window.scrollY > h.offsetHeight - 80); }
window.addEventListener('scroll', majHaut, {passive:true});
render();
if (page && S) chargerBoutique();
RP.meteo().then(m => { if (m){ meteo = m; if (tab === 2 && !page) render(true); } });
/* Liste partagée : mise à jour toutes les 20 s quand l'onglet Courses est ouvert. */
if (S && !termine()) {
  chargerEtat();
  chargerListe();
  /* Sam peut ouvrir, fermer ou changer les codes à tout moment : on relit l'état chaque minute. */
  setInterval(() => { if (!document.hidden && tab <= 1 && !page) chargerEtat(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) chargerEtat(); });
  setInterval(() => { if (page === 'liste' && !document.hidden) chargerListe(); }, 20000);
  setInterval(() => { if (page === 'album' && !document.hidden && !envoi) chargerAlbum(); }, 30 * 60 * 1000); // liens d'images valables 2 h
}
})();
</script>
