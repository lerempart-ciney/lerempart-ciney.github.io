<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Le Rempart · QR à imprimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Étiquettes à imprimer : 2 par page A4 (format A5), à plastifier et coller près de chaque appareil. */
@page{size:A4;margin:10mm}
:root{--sage:#5f7a5c;--brass:#a8782a;--ink:#1c2420;--muted:#5d6a62}
body{margin:0;font-family:"Figtree",system-ui,sans-serif;color:var(--ink);background:#eef0ec}
.bar{max-width:820px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.bar h1{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0}
.bar p{margin:0;color:var(--muted)}
.btn{align-self:flex-start;border:0;border-radius:12px;background:var(--sage);color:#fff;padding:11px 16px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:8px}
.sheet{max-width:820px;margin:0 auto 40px;display:grid;gap:16px;padding:0 16px}
.card{background:#fff;border:1.5px dashed #b9c2b6;border-radius:14px;padding:22px;display:grid;grid-template-columns:1fr 190px;gap:20px;align-items:center;page-break-inside:avoid;break-inside:avoid}
.card h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:2rem;margin:4px 0 10px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brass)}
.langs{margin:0;padding:0;list-style:none;font-size:1rem;line-height:1.6}
.langs b{display:inline-block;width:2.2em;color:var(--muted);font-size:.8rem}
.scan{margin-top:10px;font-size:.9rem;color:var(--muted)}
.qr svg{width:100%;height:auto;display:block}
@media (max-width:560px){.card{grid-template-columns:1fr}.qr{max-width:220px}}
@media print{body{background:#fff}.bar{display:none}.sheet{padding:0;max-width:none;gap:10mm}.card{height:128mm;box-sizing:border-box;border-color:#999}}
</style>
</head>
<body>
<div class="bar">
  <h1>QR à imprimer</h1>
  <p>Une étiquette par appareil, plus celle du guide du séjour. Imprime, plastifie et colle chaque étiquette près de l'appareil. Le voyageur scanne avec l'appareil photo de son téléphone : la bonne vidéo s'ouvre dans sa langue.</p>
  <button class="btn" onclick="window.print()">Imprimer</button>
</div>
<div class="sheet" id="sheet"></div>
<script src="assets/qrcode.js?v=20261123j"></script>
<script src="assets/data.js?v=20261123j"></script>
<script>
(function(){
const E = RP.esc, base = new URL('index.html', location.href).href, ordre = Object.keys(RP.langues);
const aide = {fr:'Besoin d’aide ?',en:'Need help?',nl:'Hulp nodig?',de:'Brauchen Sie Hilfe?',es:'¿Necesitáis ayuda?'};
const scan = 'Scannez · Scan · Scan · Scannen · Escanead';
const carte = (titre, lignes, url, g) => `<section class="card"><div><div class="eyebrow">Le Rempart${g?' · Gîte '+g:''}</div><h2>${E(titre)}</h2>
  <ul class="langs">${lignes.map(([k,t])=>`<li><b>${k.toUpperCase()}</b>${E(t)}</li>`).join('')}</ul>
  <div class="scan">${E(scan)}</div></div><div class="qr">${RP.qrSvg(url)}</div></section>`;
let h = carte(RP.t.tvApp.fr, ordre.filter(k=>k!=='fr').map(k=>[k, RP.t.tvApp[k]]), base);
if (RP.config.wifi.reseau) h += `<section class="card"><div><div class="eyebrow">Le Rempart</div><h2>Wi-Fi</h2><ul class="langs"><li><b>SSID</b>${E(RP.config.wifi.reseau)}</li><li><b>PW</b>${E(RP.config.wifi.motDePasse)}</li></ul><div class="scan">${E(ordre.map(k=>RP.t.tvWifiScan[k]).join(' · '))}</div></div><div class="qr">${RP.wifiQr()}</div></section>`;
Object.keys(RP.videos).forEach(k => {
  h += carte(RP.t.eq[k].fr, ordre.filter(l=>l!=='fr').map(l=>[l, RP.t.eq[k][l] + ' · ' + aide[l]]), base + '?v=' + k + (RP.seulementGite[k] && RP.seulementGite[k].length === 1 ? '&g=' + RP.seulementGite[k][0] : ''), RP.seulementGite[k] && RP.seulementGite[k].join(' et '));
});
document.getElementById('sheet').innerHTML = h;
})();
</script>
</body>
</html>
